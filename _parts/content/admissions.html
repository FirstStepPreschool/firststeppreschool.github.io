<section class="page-hero">
  <div class="page-hero-inner">
    <p class="eyebrow" data-i18n="admissions.eyebrow">Admission</p>
    <h1 data-i18n="admissions.title">Admission open for ages 2 to 6</h1>
    <p data-i18n="admissions.sub">Fill this in and send it to us on WhatsApp &mdash; we'll call you back and invite you to visit the school.</p>
  </div>
</section>

<section class="container admission-section">
  <form class="form-card card" id="admissionForm">
    <label><span data-i18n="admissions.f.parent">Parent's name</span>
      <input type="text" name="parentName" required />
    </label>
    <label><span data-i18n="admissions.f.child">Child's name</span>
      <input type="text" name="childName" required />
    </label>
    <label><span data-i18n="admissions.f.dob">Child's date of birth</span>
      <input type="date" name="childDob" required />
    </label>
    <label><span data-i18n="admissions.f.program">Program</span>
      <select name="program">
        <option selected>Playgroup</option>
        <option>Nursery</option>
        <option>Junior KG</option>
        <option>Senior KG</option>
      </select>
    </label>
    <label><span data-i18n="admissions.f.phone">Phone number</span>
      <input type="tel" name="phone" inputmode="tel" required />
    </label>
    <label><span data-i18n="admissions.f.area">Your area</span>
      <input type="text" name="area" data-i18n-attr="admissions.f.areaPlaceholder:placeholder" placeholder="e.g. Shramik Nagar, Satpur" />
    </label>
    <button type="submit" class="wa-submit">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg>
      <span data-i18n="admissions.f.submit">Send enquiry on WhatsApp</span>
    </button>
    <p class="form-note" data-i18n-html="admissions.f.note">Prefer to talk? Call <a href="tel:+918850075624">+91 88500 75624</a> or <a href="tel:+917666375569">+91 76663 75569</a>. Fees are shared on enquiry or during your school visit.</p>
  </form>
</section>

<script>
  (function () {
    var form = document.getElementById('admissionForm');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var d = new FormData(form);
      var msg =
        'Admission Enquiry - First Step Preschool\n\n' +
        "Parent's name: " + d.get('parentName') + '\n' +
        "Child's name: " + d.get('childName') + '\n' +
        "Child's date of birth: " + d.get('childDob') + '\n' +
        'Program: ' + d.get('program') + '\n' +
        'Phone number: ' + d.get('phone') + '\n' +
        'Area: ' + d.get('area');
      window.open('https://wa.me/918850075624?text=' + encodeURIComponent(msg), '_blank');
    });
  })();
</script>
