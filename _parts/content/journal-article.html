<section class="page-hero">
  <div class="page-hero-inner">
    <p class="eyebrow" data-i18n="{{A_CATEGORY_KEY}}">{{A_CATEGORY_LABEL}}</p>
    <h1 data-i18n="{{A_TITLE_KEY}}" data-page-title="{{A_TITLE_KEY}}">{{A_TITLE}}</h1>
    <p class="article-meta">
      <time class="js-date" datetime="{{A_DATE_ISO}}" data-iso="{{A_DATE_ISO}}">{{A_DATE_DISPLAY}}</time>
      <span class="dot-sep" aria-hidden="true">&middot;</span>
      <span>{{A_READ_MINUTES}} <span data-i18n="article.minRead">min read</span></span>
    </p>
  </div>
</section>

<section class="container article-section">
  <article class="article card">
    <img class="article-cover" src="{{P}}{{A_IMAGE}}" alt="{{A_IMAGE_ALT}}" />
    <div class="article-body" data-article-body>
      {{A_BODY}}
    </div>
    {{A_LANG_BODIES}}
  </article>
  <p class="article-back">
    <a href="{{P}}journal.html" class="btn-outline-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      <span data-i18n="article.back">Back to the Journal</span>
    </a>
  </p>
</section>

<section class="section">
  <div class="container">
    <div class="section-center">
      <h2 class="section-title" data-i18n="article.related">Related articles</h2>
    </div>
    <div class="card-grid-3 journal-preview-grid">
      {{RELATED_CARDS}}
    </div>
  </div>
</section>

{{A_JSONLD}}
